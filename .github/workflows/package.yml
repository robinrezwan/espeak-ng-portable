name: Package

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Build package
        shell: pwsh
        run: ./windows/package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  source:
    name: Upstream source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download eSpeak NG source
        run: |
          version=$(jq -r .version espeak-ng.json)
          source_url=$(jq -r .sourceUrl espeak-ng.json)

          mkdir -p dist
          curl --fail --location --silent --show-error --output "dist/espeak-ng-${version}-source.tar.gz" "$source_url"

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, source ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the eSpeak NG version
        run: |
          version=$(jq -r .version espeak-ng.json)

          case "$GITHUB_REF_NAME" in
            "v${version}" | "v${version}-"*) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match eSpeak NG version ${version} in espeak-ng.json"
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version espeak-ng.json)

          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "eSpeak NG ${version} (${GITHUB_REF_NAME})" \
            --notes "Unmodified eSpeak NG ${version}, packaged to run from any folder without installation. The exact source code for this version is attached as espeak-ng-${version}-source.tar.gz."
